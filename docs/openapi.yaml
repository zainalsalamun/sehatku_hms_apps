        version:
          type: integer
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [patient_id, doctor_id, slot_id, reason]
      properties:
        patient_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        slot_id:
          type: string
        reason:
          type: string
