    AppointmentUpdate:
      type: object
      additionalProperties: false
      properties:
        slot_id:
          type: string
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    AppointmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Appointment'
    AppointmentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        meta:
          $ref: '#/components/schemas/ListMeta'
        links:
          $ref: '#/components/schemas/ListLinks'
    QueueTicket:
      type: object
      required:
        - id
        - appointment_id
        - number
        - status
        - version
        - current_number
      properties:
        id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        number:
          type: string
          example: A-032
        status:
          type: string
          enum: [waiting, called, serving, skipped, completed, void]
        current_number:
          type: string
          example: A-028
        estimated_wait_minutes:
          type: integer
          minimum: 0
        called_at:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
    QueueTicketResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/QueueTicket'
    Encounter:
      type: object
      required:
        - id
        - appointment_id
        - patient_id
        - doctor_id
        - status
        - diagnoses
        - version
      properties:
        id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        symptoms:
          type: [string, 'null']
        assessment:
          type: [string, 'null']
        recommendation:
          type: [string, 'null']
        diagnoses:
          type: array
          items:
            $ref: '#/components/schemas/Diagnosis'
        status:
          type: string
          enum: [in_progress, signed, corrected]
        started_at:
          type: string
          format: date-time
        signed_at:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
    Diagnosis:
      type: object
      required: [description, type]
      properties:
        code:
          type: [string, 'null']
          maxLength: 30
        description:
          type: string
          minLength: 2
          maxLength: 500
        type:
          type: string
          enum: [primary, secondary]
    EncounterCreate:
      type: object
      additionalProperties: false
      required: [appointment_id]
      properties:
        appointment_id:
          type: string
          format: uuid
    EncounterUpdate:
      type: object
      additionalProperties: false
      properties:
        symptoms:
          type: [string, 'null']
          maxLength: 5000
        assessment:
          type: [string, 'null']
          maxLength: 5000
        recommendation:
          type: [string, 'null']
          maxLength: 5000
        diagnoses:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Diagnosis'
    EncounterResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Encounter'
    MedicalRecord:
      type: object
      required: [id, encounter_id, date, doctor_name, diagnoses]
      properties:
        id:
          type: string
          format: uuid
        encounter_id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        doctor_name:
          type: string
        diagnoses:
          type: array
          items:
            $ref: '#/components/schemas/Diagnosis'
        prescription_id:
          type: [string, 'null']
          format: uuid
        document_count:
          type: integer
          minimum: 0
    MedicalRecordListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MedicalRecord'
        meta:
          $ref: '#/components/schemas/ListMeta'
        links:
          $ref: '#/components/schemas/ListLinks'
    Prescription:
      type: object
      required: [id, encounter_id, patient_id, doctor_id, status, items, issued_at]
      properties:
        id:
          type: string
          format: uuid
        encounter_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, issued, dispensed, void]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
        issued_at:
          type: string
          format: date-time
    PrescriptionItem:
      type: object
      required:
        - medicine
        - dosage
        - route
        - frequency
        - duration_days
        - quantity
      properties:
        medicine:
          type: string
          maxLength: 200
        dosage:
          type: string
          maxLength: 100
        route:
          type: string
          maxLength: 50
        frequency:
          type: string
          maxLength: 100
        duration_days:
          type: integer
          minimum: 1
          maximum: 365
        quantity:
          type: number
          exclusiveMinimum: 0
        instruction:
          type: [string, 'null']
          maxLength: 500
    PrescriptionCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PrescriptionItem'
    PrescriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Prescription'
    Money:
      type: object
      required: [value, currency]
      properties:
        value:
          type: integer
          minimum: 0
          description: Minor currency unit. For IDR this is whole rupiah.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: IDR
    Invoice:
      type: object
      required: [id, number, patient_id, total, status, version]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        appointment_id:
          type: string
          format: uuid
